<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="ひもの端を動かして、からまりをほどくパズル。あせらず、自分のペースで。PCで遊べる、オフライン対応のひもほどき。">
  <title>ひもほどき — あせらず、ひとつずつ。</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#board">パズルへ移動</a>
  <header class="site-header">
    <a href="./" class="brand" aria-label="ひもほどき ホーム">
      <img src="./icons/icon.svg" width="48" height="48" alt="">
      <span>ひもほどき<small>あせらず、ひとつずつ。</small></span>
    </a>
    <nav aria-label="メニュー">
      <button id="help-button" class="text-button"><span aria-hidden="true">？</span> あそびかた</button>
      <button id="text-button" class="text-button" aria-pressed="false">文字を大きく</button>
      <button id="install-button" class="install-button">インストール <span aria-hidden="true">↓</span></button>
      <span id="update-notice" class="update-notice" hidden><button id="update-button" title="記録を保存して新しいバージョンに更新します">更新する</button></span>
    </nav>
  </header>
  <main class="main-shell">
    <div class="input-toolbar">
      <label for="input-method">操作方法</label><select id="input-method"><option value="mouse">マウス・タッチ</option><option value="keyboard">キーボード</option><option value="controller">コントローラー</option></select>
      <button id="controller-button">コントローラーをつなぐ</button>
      <button id="music-button" aria-pressed="false" title="音楽を再生します">音楽：再生</button>
      <span id="controller-status" role="status" aria-live="polite"></span>
    </div>
    <p id="save-error" class="save-error" role="alert" hidden></p>
    <div class="play-layout">
      <aside class="side-panel">
        <div class="chapter"><span id="group-name">はじめて</span><span id="level-number">01 / 20</span></div>
        <h1 id="level-title">はじめの一歩</h1>
        <div class="instruction-card">
          <span class="step-marker" id="step-marker">1</span>
          <div><h2 id="instruction-title">ひもの端をえらぶ</h2><p id="instruction-detail">色のついた丸をクリック。</p></div>
        </div>
        <button class="primary-button" id="hint-button"><span aria-hidden="true">✧</span> ヒントをみる</button>
        <div class="secondary-actions"><button id="undo-button" disabled><span aria-hidden="true">↶</span> １手もどす</button><button id="restart-button"><span aria-hidden="true">↻</span> はじめから</button></div>
        <div class="progress-area"><div><span>これまでの達成</span><strong id="progress-count">0 <small>/ 20問</small></strong></div><progress id="progress-bar" max="20" value="0" aria-label="クリアした問題数"></progress><button class="stage-button" id="stages-button">問題をえらぶ <span aria-hidden="true">→</span></button></div>
        <div class="player-change"><button id="next-player-button">次の人へ（リセット）</button></div>
      </aside>
      <section class="puzzle-card" aria-label="パズル">
        <div class="board-toolbar"><button id="rating-button" class="rating-button" aria-label="星の条件を見る"><span id="live-stars" aria-hidden="true">★★★</span><span id="elapsed-time">0.0秒</span></button><div class="board-stats"><span id="board-status" class="sr-only">ひもをほどこう</span><span>のこり <strong id="rope-count">2</strong> 本</span><span><strong id="move-count">0</strong> 手</span></div></div>
        <div class="board-wrap"><div id="board" class="board" role="group" tabindex="-1" aria-label="ひもの盤面" aria-describedby="input-guide"></div><div id="clear-panel" class="clear-panel" hidden></div></div>
        <div class="input-help"><div id="input-guide"></div><button id="controller-menu-button" hidden>操作メニュー</button></div>
      </section>
    </div>
  </main>
  <span id="feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="controller-dialog" aria-labelledby="controller-title"></dialog>
  <audio id="bgm" preload="none" loop hidden></audio>
  <noscript>このパズルを遊ぶには、ブラウザーのJavaScriptを有効にしてください。</noscript>
</body>
</html>
